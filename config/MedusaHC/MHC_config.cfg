[include MHC_variables.cfg]
[include MHC_macros.cfg]

[pin_watch io]
  # SINGLE-SENSOR FORK: only one endstop, on the main toolhead (pin_e).
  # It answers "is a hotend attached?" (pressed = attached). Which hotend is
  # mounted is tracked in software and saved with SAVE_VARIABLE
  # (mhc_mounted_tool). Do NOT add pin_t0..pin_tN dock switches.
  # current_tool:
  #  -1 = head empty (pin_e released)
  #  0..N-1 = tool tracked as mounted while pin_e is pressed
  #  -2 = hotend attached but tool unknown -> run MHC_ASSIGN_TOOL T=<n>
  # Optional compatibility with klipper-toolchanger. Keep disabled unless the
  # plugin is installed and configured separately.
  sync_toolchanger: 0
  verbose: 1
  pin_e: ^!PF10
  tool_count: 4
  sync_mainsail_tools: 1
  sync_mainsail_sensors: 1

[duplicate_pin_override]
pins: mcu:PF10, mcu:PG13, mcu:PG12, mcu:PG15

