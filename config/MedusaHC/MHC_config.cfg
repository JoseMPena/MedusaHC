nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0
sensor_pin: PB0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 36.193
pid_Ki: 16.086
pid_Kd: 20.358
min_temp: 0
max_temp: 290
max_extrude_cross_section: 9999999
max_extrude_only_distance: 700
