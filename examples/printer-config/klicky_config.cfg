# Klicky (Zero) probe: Z reference AND per-hotend Z auto-calibration.
# Replaces eddy_config.cfg. Do not include both.
#
# Assumption: the Klicky switch sits directly under the nozzle, so every
# hotend can press it and Z trigger heights can be compared between tools.
# Klicky attach/dock macros (ATTACH_PROBE / DOCK_PROBE) come from the
# Klicky-Probe project; set the two variables below to match your setup.

[probe]
pin: ^!PG11                # CHANGE: Klicky switch pin
x_offset: 0                # CHANGE: ~0 when the switch is under the nozzle
y_offset: 0
z_offset: 0                # tune with PROBE_CALIBRATE
speed: 5
lift_speed: 10
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

[bed_mesh]
horizontal_move_z: 2
speed: 200
mesh_min: 20, 15           # CHANGE
mesh_max: 215, 190         # CHANGE
probe_count: 5, 5
algorithm: bicubic

[gcode_macro _KLICKY_CFG]
# Point on the bed where the nozzle presses the Klicky (X/Y of the nozzle).
variable_cal_x: 120
variable_cal_y: 110
# Absolute Z that clears the top of the Klicky before XY travel. Must be
# above trigger height (e.g. 30 if contact is near Z=20). Z=5 is often too low.
variable_cal_z_safe: 30
# Max allowed Z-trigger spread between samples (mm); unused by CALIBRATE_TOOL_Z
# itself but kept for future / manual probing helpers.
variable_tolerance: 0.02
# Set to 1 if your config provides Klicky ATTACH_PROBE / DOCK_PROBE.
variable_use_dock: 0
gcode:

[gcode_macro BED_CALIBRATION]
gcode:
    BED_MESH_CALIBRATE ADAPTIVE=1

# START_PRINT compatibility: Z0 comes from [probe] z_offset, no tap needed.
[gcode_macro TAP_BASE_TOOL]
gcode:
    RESPOND MSG="TAP_BASE_TOOL: skipped (Klicky z_offset defines Z=0)"

[gcode_macro _KLICKY_MEASURE]
description: Probe the Klicky with the mounted hotend, store trigger Z in _PROBE_RES
gcode:
    {% set k = printer["gcode_macro _KLICKY_CFG"] %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G90
    G1 Z{k.cal_z_safe} F600
    G1 X{k.cal_x} Y{k.cal_y} F12000
    PROBE
    SET_GCODE_VARIABLE MACRO=_PROBE_RES VARIABLE=z VALUE={printer.probe.last_z_result}
    G1 Z{k.cal_z_safe} F600

[gcode_macro _PROBE_RES]
variable_z: 0.0
variable_z0: 0.0
gcode:

# Separate macros so Jinja is evaluated AFTER PROBE (Klipper renders a
# parent macro's template once before any of its G-code runs).
[gcode_macro _KLICKY_STORE_REF]
description: Save the just-measured T0 trigger Z as the calibration reference
gcode:
    {% set z0 = printer["gcode_macro _PROBE_RES"].z|float %}
    SET_GCODE_VARIABLE MACRO=_PROBE_RES VARIABLE=z0 VALUE={z0}
    RESPOND MSG="CALIBRATE_TOOL_Z: T0 reference Z={z0}"

[gcode_macro _KLICKY_COMMIT_OFFSET]
description: Store Tn G-code Z offset from the latest probe vs the T0 reference
gcode:
    {% set t = params.T|int %}
    {% set z0 = printer["gcode_macro _PROBE_RES"].z0|float %}
    {% set zt = printer["gcode_macro _PROBE_RES"].z|float %}
    {% set off = zt - z0 %}
    RESPOND MSG="T{t}: Z trigger {zt} (T0 {z0}) -> z offset {off}"
    SET_GCODE_VARIABLE MACRO=_TOOL_OFFSET VARIABLE=t{t}_off_z VALUE={off}
    SAVE_VARIABLE VARIABLE=t{t}_gcode_z_offset VALUE={off}

[gcode_macro CALIBRATE_TOOL_Z]
description: Auto-calibrate per-hotend Z offsets vs T0 with the Klicky. Run after homing.
gcode:
    {% set k = printer["gcode_macro _KLICKY_CFG"] %}
    {% set N = printer["gcode_macro _GLOBAL_STATE"].max_tool|int %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    {% if k.use_dock|int == 1 %}
        ATTACH_PROBE
    {% endif %}
    # Cold calibration: no M104/M109. Heat softens the nozzle and changes Z;
    # compare tools at ambient for repeatable G-code Z offsets.
    SET T=0
    _KLICKY_MEASURE
    _KLICKY_STORE_REF
    {% for t in range(1, N) %}
        SET T={t}
        _KLICKY_MEASURE
        _KLICKY_COMMIT_OFFSET T={t}
    {% endfor %}
    {% if k.use_dock|int == 1 %}
        DOCK_PROBE
    {% endif %}
    DROP_TOOL
